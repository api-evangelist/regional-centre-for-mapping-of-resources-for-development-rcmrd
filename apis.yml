name: Regional Centre for Mapping of Resources for Development (RCMRD)

description: 'The Regional Centre for Mapping of Resources for Development (RCMRD) is an inter‑governmental organization established in Nairobi, Kenya in 1975 under the United Nations Economic Commission for Africa and the African Union. It supports 20 member states across Eastern and Southern Africa, providing geospatial data, mapping services, and capacity building to aid sustainable development, climate resilience, and policy planning across the region.'

